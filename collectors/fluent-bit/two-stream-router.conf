# Fluent Bit / AWS ECS FireLens — Two-Stream Security Router
# Separates `stream == "security"` from operational/debug logs BEFORE egress.
# Works for ECS Fargate FireLens, EKS DaemonSet, AKS, or Linux VMs.

[SERVICE]
    Flush               5
    Log_Level           info
    Storage.path        /var/log/flb-storage/
    Storage.sync        normal
    Storage.checksum    on
    Storage.max_chunks_up 128

[FILTER]
    Name                rewrite_tag
    Match               app.*
    Rule                $stream ^security$ security.$TAG false
    Rule                $stream ^(?!security$).* operational.$TAG false
    Emitter_Name        re_emitted
    Emitter_Storage.type filesystem

# Drop accidental DEBUG/TRACE or health probes from the security tag
[FILTER]
    Name                grep
    Match               security.*
    Exclude             severity ^(DEBUG|TRACE)$
    Exclude             message /(healthz?|readyz?|livez?|metrics)

# Route Stream A (Security) -> Bower collector (recommended) OR AWS Firehose / SIEM
[OUTPUT]
    Name                http
    Match               security.*
    Host                ${BOWER_COLLECTOR_HOST}
    Port                4319
    URI                 /v1/events
    Format              json_lines
    Header              Authorization Bearer ${BOWER_INGEST_TOKEN}
    tls                 On
    Retry_Limit         False
    storage.total_limit_size 2G

# Alternative AWS-native Stream A output (uncomment if routing directly to Firehose):
# [OUTPUT]
#     Name              kinesis_firehose
#     Match             security.*
#     region            ap-southeast-2
#     delivery_stream   soc-security-events

# Route Stream B (Operational) -> low-cost CloudWatch / APM (never Sentinel/SIEM)
[OUTPUT]
    Name                cloudwatch_logs
    Match               operational.*
    region              ap-southeast-2
    log_group_name      /aws/ecs/custom-app-operational
    log_stream_prefix   ops-
    auto_create_group   true
