<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" width="1120" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Agent-Assisted Vendor-to-SOC Logging Lifecycle</title>
  <desc id="desc">Six-step workflow from installing AI agent skills, auditing a vendor repo, implementing a two-stream security logger, verifying logs in CI, generating the SOC handoff pack, and running a live SIEM purple-team test.</desc>
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .card-hi { fill: #064e3b; stroke: #10b981; stroke-width: 2; rx: 12; }
      .num { fill: #38bdf8; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 700; }
      .num-hi { fill: #6ee7b7; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 700; }
      .h { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; }
      .t { fill: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .mono { fill: #93c5fd; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
      .arrow { stroke: #38bdf8; stroke-width: 2.2; fill: none; marker-end: url(#a); }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1120" height="330" rx="16" class="bg"/>
  <text x="32" y="42" class="title">Low-Effort Vendor-to-SOC Lifecycle (Human + AI Coding Agent Workflow)</text>
  <text x="32" y="64" class="subtitle">From zero to ATO-ready, ACSC &amp; OWASP aligned SIEM telemetry using portable skills and zero-dependency CLI gates</text>

  <!-- Step 1 -->
  <rect x="28" y="96" width="160" height="198" class="card"/>
  <text x="44" y="122" class="num">STEP 01</text>
  <text x="44" y="146" class="h">Install Skills</text>
  <text x="44" y="172" class="t">Drop 4 portable skills</text>
  <text x="44" y="188" class="t">into Claude, Codex,</text>
  <text x="44" y="204" class="t">Cursor, Antigravity,</text>
  <text x="44" y="220" class="t">Copilot, or OpenCode.</text>
  <text x="44" y="256" class="mono">install-skills.sh</text>

  <!-- Step 2 -->
  <rect x="208" y="96" width="160" height="198" class="card"/>
  <text x="224" y="122" class="num">STEP 02</text>
  <text x="224" y="146" class="h">Audit Codebase</text>
  <text x="224" y="172" class="t">Find missing authn,</text>
  <text x="224" y="188" class="t">authz, privilege &amp;</text>
  <text x="224" y="204" class="t">export hooks, noise,</text>
  <text x="224" y="220" class="t">&amp; secret leaks.</text>
  <text x="224" y="256" class="mono">soc-logging-audit</text>
  <text x="224" y="274" class="mono">audit_repo_logging</text>

  <!-- Step 3 -->
  <rect x="388" y="96" width="160" height="198" class="card"/>
  <text x="404" y="122" class="num">STEP 03</text>
  <text x="404" y="146" class="h">Implement</text>
  <text x="404" y="172" class="t">Wire SecurityLogger</text>
  <text x="404" y="188" class="t">wrapper (TS/Py/C#/Go)</text>
  <text x="404" y="204" class="t">with redaction, UTC,</text>
  <text x="404" y="220" class="t">&amp; CWE-117 safety.</text>
  <text x="404" y="256" class="mono">soc-logging-</text>
  <text x="404" y="274" class="mono">implement</text>

  <!-- Step 4 -->
  <rect x="568" y="96" width="160" height="198" class="card"/>
  <text x="584" y="122" class="num">STEP 04</text>
  <text x="584" y="146" class="h">Verify &amp; Gate CI</text>
  <text x="584" y="172" class="t">Enforce strict schema,</text>
  <text x="584" y="188" class="t">0 secret/PII leaks, &amp;</text>
  <text x="584" y="204" class="t">Signal-to-Noise score</text>
  <text x="584" y="220" class="t">&gt;= 90 on every PR.</text>
  <text x="584" y="256" class="mono">validate_logs.py</text>
  <text x="584" y="274" class="mono">score_signal_noise</text>

  <!-- Step 5 -->
  <rect x="748" y="96" width="160" height="198" class="card"/>
  <text x="764" y="122" class="num">STEP 05</text>
  <text x="764" y="146" class="h">SOC Handoff Pack</text>
  <text x="764" y="172" class="t">Generate Event Catalog,</text>
  <text x="764" y="188" class="t">volume baselines,</text>
  <text x="764" y="204" class="t">golden NDJSON, &amp;</text>
  <text x="764" y="220" class="t">Sigma / KQL / SPL.</text>
  <text x="764" y="256" class="mono">soc-handoff-pack</text>
  <text x="764" y="274" class="mono">generate_soc_handoff</text>

  <!-- Step 6 -->
  <rect x="928" y="96" width="164" height="198" class="card-hi"/>
  <text x="944" y="122" class="num-hi">STEP 06</text>
  <text x="944" y="146" class="h">Live SOC Test</text>
  <text x="944" y="172" class="t">Replay synthetic</text>
  <text x="944" y="188" class="t">attack scenarios into</text>
  <text x="944" y="204" class="t">UAT SIEM &amp; verify</text>
  <text x="944" y="220" class="t">alerts + heartbeat.</text>
  <text x="944" y="256" class="mono">generate_test_events</text>
  <text x="944" y="274" class="mono">ATO / Go-Live Ready</text>

  <!-- Arrows -->
  <path d="M 188 195 L 206 195" class="arrow"/>
  <path d="M 368 195 L 386 195" class="arrow"/>
  <path d="M 548 195 L 566 195" class="arrow"/>
  <path d="M 728 195 L 746 195" class="arrow"/>
  <path d="M 908 195 L 926 195" class="arrow"/>
</svg>
