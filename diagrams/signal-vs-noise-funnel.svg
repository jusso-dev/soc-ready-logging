<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Signal-to-Noise Filtering Funnel for SOC SIEM Ingestion</title>
  <desc id="desc">Shows how raw application telemetry is filtered from 100 percent volume down to 1 to 3 percent high-value, low-noise, schema-validated SOC security events.</desc>
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; }
      .stage1 { fill: #334155; stroke: #64748b; stroke-width: 1.5; }
      .stage2 { fill: #172554; stroke: #38bdf8; stroke-width: 1.5; }
      .stage3 { fill: #312e81; stroke: #818cf8; stroke-width: 1.5; }
      .stage4 { fill: #064e3b; stroke: #10b981; stroke-width: 2; }
      .drop { fill: #4c0519; stroke: #fb7185; stroke-width: 1.5; rx: 10; }
      .h { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; }
      .t { fill: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .pct { fill: #38bdf8; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 700; }
      .pct-good { fill: #34d399; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 700; }
      .pct-drop { fill: #fda4af; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 700; }
      .arrow { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arr); }
      .arrow-drop { stroke: #fb7185; stroke-width: 2; stroke-dasharray: 5 4; fill: none; marker-end: url(#arr-drop); }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-drop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fb7185"/>
    </marker>
  </defs>

  <rect width="980" height="500" rx="16" class="bg"/>
  <text x="32" y="42" class="title">Signal-to-Noise Filtering Funnel (ACSC Priority Logs Discipline)</text>
  <text x="32" y="64" class="subtitle">Cut SIEM ingestion bills by 90%+ while increasing SOC detection fidelity and analyst trust</text>

  <!-- Stage 1 -->
  <polygon points="40,96 620,96 588,166 72,166" class="stage1"/>
  <text x="330" y="124" text-anchor="middle" class="h">100% Raw Application Activity</text>
  <text x="330" y="146" text-anchor="middle" class="t">HTTP requests, health probes, static assets, SQL traces, auth, admin, data exports</text>

  <!-- Drop side box -->
  <rect x="670" y="96" width="278" height="170" class="drop"/>
  <text x="688" y="122" class="pct-drop">~90–95% DIVERTED TO APM / OPS</text>
  <text x="688" y="146" class="h">Never Send to SIEM</text>
  <text x="688" y="170" class="t">• /healthz, /readyz, /metrics probes</text>
  <text x="688" y="190" class="t">• Static files (.js, .css, .png, .woff2)</text>
  <text x="688" y="210" class="t">• DEBUG / TRACE &amp; SQL query logs</text>
  <text x="688" y="230" class="t">• Per-request valid JWT checks</text>
  <text x="688" y="250" class="t">• Routine UX form typos &amp; 200 reads</text>
  <path d="M 604 132 L 668 132" class="arrow-drop"/>

  <!-- Stage 2 -->
  <polygon points="84,192 576,192 544,262 116,262" class="stage2"/>
  <text x="330" y="220" text-anchor="middle" class="h">Security-Relevant Transitions (~5–10%)</text>
  <text x="330" y="242" text-anchor="middle" class="t">Authn, MFA, Authz 403, IAM, Privileges, Sensitive Exports, Config, Crypto, Tamper</text>
  <path d="M 330 166 L 330 190" class="arrow"/>

  <!-- Stage 3 -->
  <polygon points="128,288 532,288 500,362 160,362" class="stage3"/>
  <text x="330" y="316" text-anchor="middle" class="h">Hygiene, Redaction &amp; Flood Control</text>
  <text x="330" y="338" text-anchor="middle" class="t">Windowed rate-limit summaries • Redact secrets/PII • Strip CWE-117 • UTC + trace ID</text>
  <path d="M 330 262 L 330 286" class="arrow"/>

  <!-- Stage 4 -->
  <polygon points="172,388 488,388 470,468 190,468" class="stage4"/>
  <text x="330" y="418" text-anchor="middle" class="pct-good">1–3% HIGH-VALUE SOC SIGNAL</text>
  <text x="330" y="440" text-anchor="middle" class="h">SIEM-Ready NDJSON Stream</text>
  <text x="330" y="458" text-anchor="middle" class="t">Score &gt;= 90/100 • 0 leaks • Day-1 KQL/Sigma</text>
  <path d="M 330 362 L 330 386" class="arrow"/>

  <!-- Right bottom summary card -->
  <rect x="670" y="302" width="278" height="166" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="688" y="330" class="pct">CI QUALITY GATE TARGETS</text>
  <text x="688" y="358" class="t">• Schema compliance: 100%</text>
  <text x="688" y="380" class="t">• Secret / PII leaks: 0</text>
  <text x="688" y="402" class="t">• CWE-117 injection issues: 0</text>
  <text x="688" y="424" class="t">• Signal-to-Noise Score: &gt;= 90 / 100</text>
  <text x="688" y="446" class="t">• P95 event payload: &lt; 2 KB</text>
</svg>
