title: Custom Application Privilege Escalation or Impersonation
id: 7a3f5c10-2e6b-4d4e-9a4b-6f9c12b40002
status: experimental
description: Detects assignment of elevated roles, MFA disablement, or administrative user impersonation in custom applications.
author: jusso-dev/soc-ready-logging
date: 2026-11-21
references:
  - https://www.cyber.gov.au/ism
logsource:
  category: application
  product: custom_app
detection:
  selection_priv:
    stream: security
    event:
      - priv_role_assigned
      - authz_impersonation_start
      - authn_mfa_disabled
    outcome: success
  condition: selection_priv
falsepositives:
  - Authorised IT change requests (correlate details.ticket_ref with ITSM change ticket)
level: high
tags:
  - attack.privilege_escalation
  - attack.persistence
  - attack.t1098
  - attack.t1134
  - attack.t1556.006
