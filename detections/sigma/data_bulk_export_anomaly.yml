title: Custom Application Sensitive Bulk Data Export
id: 7a3f5c10-2e6b-4d4e-9a4b-6f9c12b40003
status: experimental
description: Detects bulk export of OFFICIAL:Sensitive, PROTECTED, or CONFIDENTIAL records from a custom application.
author: jusso-dev/soc-ready-logging
date: 2026-11-21
references:
  - https://www.cyber.gov.au/ism
logsource:
  category: application
  product: custom_app
detection:
  selection:
    stream: security
    event: data_bulk_export
    outcome: success
    target.classification:
      - 'OFFICIAL:Sensitive'
      - 'PROTECTED'
      - 'CONFIDENTIAL'
      - 'RESTRICTED'
  condition: selection
falsepositives:
  - Scheduled service account exports documented in the SOC Handoff Pack
level: high
tags:
  - attack.collection
  - attack.exfiltration
  - attack.t1530
