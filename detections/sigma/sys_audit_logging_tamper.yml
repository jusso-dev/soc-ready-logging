title: Custom Application Security Audit Logging Tamper Attempt
id: 7a3f5c10-2e6b-4d4e-9a4b-6f9c12b40004
status: experimental
description: Detects attempts to disable security audit logging, reduce logging verbosity below baseline, or clear audit logs.
author: jusso-dev/soc-ready-logging
date: 2026-11-21
references:
  - https://www.cyber.gov.au/ism
logsource:
  category: application
  product: custom_app
detection:
  selection:
    stream: security
    event: tamper_logging_disabled_or_cleared
  condition: selection
falsepositives:
  - None expected in production; investigate immediately.
level: critical
tags:
  - attack.defense_evasion
  - attack.t1562.008
  - attack.t1070
